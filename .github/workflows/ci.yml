name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan checks and deploys
    runs-on: ubuntu-latest
    outputs:
      relay: ${{ steps.plan.outputs.relay }}
      migrate: ${{ steps.plan.outputs.migrate }}
      expo_build: ${{ steps.plan.outputs.expo_build }}
      expo_update: ${{ steps.plan.outputs.expo_update }}
      native_tests: ${{ steps.plan.outputs.native_tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/collect-release-plan.mjs

  test-app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:setup

  test-relay:
    name: Relay checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --prefix relay
      - run: npm run relay:typecheck
      - run: npm run relay:test

  test-android:
    name: Android unit tests
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.native_tests == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
      - run: npm ci
      - run: npx expo prebuild --non-interactive --platform android --no-install
      - name: Run notifier-native unit tests
        working-directory: android
        run: chmod +x gradlew && ./gradlew :notifier-native:testDebugUnitTest --stacktrace --no-daemon

  deploy-relay:
    name: Deploy relay
    runs-on: ubuntu-latest
    needs: [plan, test-app, test-relay, test-android]
    if: >-
      needs.plan.outputs.relay == 'true' &&
      needs.test-app.result == 'success' &&
      needs.test-relay.result == 'success' &&
      (needs.test-android.result == 'success' || needs.test-android.result == 'skipped')
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --prefix relay
      - name: Require relay secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "$CLOUDFLARE_D1_DATABASE_ID" ] || missing+=("CLOUDFLARE_D1_DATABASE_ID")
          [ -n "$FIREBASE_PROJECT_ID" ] || missing+=("FIREBASE_PROJECT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Relay deploy needs these repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          umask 077
          printf 'CLOUDFLARE_D1_DATABASE_ID=%s\nFIREBASE_PROJECT_ID=%s\n' \
            "$CLOUDFLARE_D1_DATABASE_ID" "$FIREBASE_PROJECT_ID" > relay/.env
      - name: Apply database migrations
        if: needs.plan.outputs.migrate == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm --prefix relay run migrate
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm --prefix relay run deploy

  deploy-android:
    name: Build Android binary
    runs-on: ubuntu-latest
    needs: [plan, test-app, test-relay, test-android]
    if: >-
      needs.plan.outputs.expo_build == 'true' &&
      needs.test-app.result == 'success' &&
      needs.test-relay.result == 'success' &&
      needs.test-android.result == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add the EXPO_TOKEN repository secret before Expo builds can run."
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Refuse placeholder app configuration
        run: eas env:exec --environment preview --non-interactive -- node scripts/assert-release-env.mjs
      - name: Queue the preview APK
        run: eas build --platform android --profile preview --non-interactive --no-wait

  deploy-update:
    name: Publish JavaScript update
    runs-on: ubuntu-latest
    needs: [plan, test-app, test-relay, test-android]
    if: >-
      needs.plan.outputs.expo_update == 'true' &&
      needs.test-app.result == 'success' &&
      needs.test-relay.result == 'success' &&
      (needs.test-android.result == 'success' || needs.test-android.result == 'skipped')
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add the EXPO_TOKEN repository secret before Expo updates can run."
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Refuse placeholder app configuration
        run: eas env:exec --environment preview --non-interactive -- node scripts/assert-release-env.mjs
      - name: Publish to the preview channel
        run: eas update --channel preview --environment preview --non-interactive --message "ci ${GITHUB_SHA}"
