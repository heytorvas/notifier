name = "notifier-relay"
main = "src/index.ts"
compatibility_date = "2026-10-28"

[triggers]
crons = ["17 4 * * *"]

[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "SEND_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "notifier-relay"
database_id = "56e2f0af-f93e-499c-a299-362056f25b8b"
migrations_dir = "migrations"

[vars]
FIREBASE_PROJECT_ID = "notifier-app-2026"
ANDROID_PACKAGE_NAME = "dev.heytor.notifier"
